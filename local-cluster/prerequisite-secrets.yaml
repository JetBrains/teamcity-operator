# Secrets with fixed values, applied before any chart that consumes them
# (Helm cannot create passwords and cluster resources in the right order).

# The Percona operator creates the Postgres role from a secret holding only
# the 'password' key, and enriches it with the connection details.
apiVersion: v1
kind: Namespace
metadata:
  name: teamcity
---
apiVersion: v1
kind: Secret
metadata:
  name: teamcity-pg-credentials
  namespace: teamcity
type: Opaque
stringData:
  password: teamcity
---
# The TeamCity operator reads the database connection details from this
# secret. The values are deterministic because the Postgres role and the
# cluster name are fixed: the pg-db chart names the cluster '<release>-pg'
# (truncated at 21 characters), so the PgBouncer service is
# '<release>-pg-pgbouncer'.
apiVersion: v1
kind: Secret
metadata:
  name: database-properties
  namespace: teamcity
type: Opaque
stringData:
  connectionUrl: jdbc:postgresql://teamcity-database-pg-pgbouncer:5432/teamcity
  connectionProperties.user: teamcity
  connectionProperties.password: teamcity