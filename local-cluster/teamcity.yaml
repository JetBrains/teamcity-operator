# The multi-node TeamCity instance. The TeamCity CRD is installed by the
# operator chart, so Tilt waits for it before applying this manifest.
apiVersion: jetbrains.com/v1beta1
kind: TeamCity
metadata:
  name: teamcity
  namespace: teamcity
  finalizers:
    - "teamcity.jetbrains.com/finalizer"
spec:
  image: jetbrains/teamcity-server
  databaseSecret:
    secret: database-properties
  startupPropertiesConfig:
    teamcity.startup.maintenance: "false"
    teamcity.firstStart.setupAdmin.enabled: "false"
    teamcity.superUser.token: "superuser-token"
  xmxPercentage: 50
  dataDirVolumeClaim:
    name: teamcity-data-dir
    volumeMount:
      name: teamcity-data-dir
      mountPath: /storage
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
  mainNode:
    name: main-node
    spec:
      requests:
        cpu: "500m"
        memory: "2Gi"
      responsibilities: ["MAIN_NODE", "CAN_PROCESS_USER_DATA_MODIFICATION_REQUESTS"]
  secondaryNodes:
    - name: secondary-node-1
      spec:
        requests:
          cpu: "500m"
          memory: "1Gi"
        responsibilities: ["CAN_PROCESS_BUILD_MESSAGES", "CAN_CHECK_FOR_CHANGES"]
    - name: secondary-node-2
      spec:
        requests:
          cpu: "500m"
          memory: "1Gi"
        responsibilities: ["CAN_PROCESS_BUILD_TRIGGERS"]
  serviceList:
    - name: teamcity
      spec:
        selector:
          app.kubernetes.io/name: teamcity
          app.kubernetes.io/component: teamcity-server
          app.kubernetes.io/part-of: teamcity
        ports:
          - protocol: TCP
            port: 8111
            targetPort: 8111
        clusterIP: None
  ingressList:
    - name: teamcity
      annotations: {}
      spec:
        rules:
          - host: teamcity.local
            http:
              paths:
                - backend:
                    service:
                      name: teamcity
                      port:
                        number: 8111
                  pathType: ImplementationSpecific