name: PR dependency checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-dependency-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Go from go.mod (actions/setup-go v7.0.0)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Install govulncheck v1.10.0
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0

      - name: Scan reachable code
        run: |
          set -euo pipefail
          go version
          "$(go env GOPATH)/bin/govulncheck" -show verbose ./... | tee govulncheck.txt
          {
            echo "### govulncheck"
            echo '```'
            tail -n 20 govulncheck.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes (actions/dependency-review-action v5.0.0)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: low
          comment-summary-in-pr: never
          allow-licenses: Apache-2.0, BSD-2-Clause, BSD-3-Clause, MIT, ISC, MPL-2.0, LicenseRef-scancode-google-patent-license-golang
          show-patched-versions: true
