name: Trigger TeamCity tests

# Queues TeamCity Test&Build only when someone comments /test on a pull request.
# Uses branch pull/<number> (required for fork PRs). TeamCity VCS trigger is disabled.
#
# TeamCity must have the Pull Requests build feature enabled (see .teamcity/builds/TestBuild.kt).

on:
  issue_comment:
    types: [created]

jobs:
  trigger-teamcity:
    name: Trigger TeamCity pipeline
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/test')
    outputs:
      build_id: ${{ steps.trigger.outputs.build_id }}
      build_url: ${{ steps.trigger.outputs.build_url }}
    steps:
      - name: Resolve PR number, TeamCity branch and commit
        id: pr
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.comment.user.login }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          PERM=$(curl -s -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/$REPO/collaborators/$AUTHOR/permission" | jq -r '.permission // empty')
          [ "$PERM" = "admin" ] || {
            echo "::error::Only repository admins can trigger /test. User '$AUTHOR' has permission: ${PERM:-none}."
            exit 1
          }

          PR_NUM="$ISSUE_NUM"
          [ -n "$PR_NUM" ] || { echo "::error::Could not resolve pull request number"; exit 1; }

          FIRST_LINE=$(printf '%s\n' "$COMMENT" | head -n1 | tr -d '\r')
          if [[ "$FIRST_LINE" =~ ^/test[[:space:]]*$ ]]; then
            REQUESTED=""
          elif [[ "$FIRST_LINE" =~ ^/test[[:space:]]+([0-9a-f]{7,40})[[:space:]]*$ ]]; then
            REQUESTED="${BASH_REMATCH[1]}"
          else
            echo "::error::Use '/test' or '/test <commit sha>'."
            exit 1
          fi

          HEAD_SHA=$(curl -s -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/$REPO/pulls/$PR_NUM" | jq -r '.head.sha // empty')
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Could not resolve PR head commit"; exit 1; }
          if [ -n "$REQUESTED" ] && [[ "$HEAD_SHA" != "$REQUESTED"* ]]; then
            echo "::error::Requested commit $REQUESTED is not the PR head ($HEAD_SHA). Review the new commits first."
            exit 1
          fi

          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "teamcity_branch=pull/$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Triggering TeamCity for PR #$PR_NUM (branch pull/$PR_NUM) at $HEAD_SHA"

      - name: Trigger TeamCity pipeline
        id: trigger
        env:
          TEAMCITY_SERVER_URL: ${{ vars.TEAMCITY_SERVER_URL }}
          TEAMCITY_PIPELINE_ID: ${{ vars.TEAMCITY_PIPELINE_ID }}
          TEAMCITY_TOKEN: ${{ secrets.TEAMCITY_TOKEN }}
          BRANCH_NAME: ${{ steps.pr.outputs.teamcity_branch }}
          PR_NUM: ${{ steps.pr.outputs.pr_number }}
          SHA: ${{ steps.pr.outputs.sha }}
          TEAMCITY_VCS_ROOT_ID: ${{ vars.TEAMCITY_VCS_ROOT_ID || 'TeamCityOperatorBuilds_TeamCityOperatorVCSRoot' }}
        run: |
          [ -n "$TEAMCITY_SERVER_URL" ] && [ -n "$TEAMCITY_PIPELINE_ID" ] && [ -n "$TEAMCITY_TOKEN" ] || \
            { echo "::error::Set TEAMCITY_SERVER_URL, TEAMCITY_PIPELINE_ID (variables) and TEAMCITY_TOKEN (secret)."; exit 1; }

          BASE="${TEAMCITY_SERVER_URL%/}"
          BODY=$(jq -n --arg id "$TEAMCITY_PIPELINE_ID" --arg branch "$BRANCH_NAME" --arg sha "$SHA" \
            --arg vcsBranch "refs/pull/$PR_NUM/head" --arg root "$TEAMCITY_VCS_ROOT_ID" \
            '{ buildType: { id: $id },
               branchName: $branch,
               revisions: { failOnMissingRevisions: true,
                            revision: [ { version: $sha, vcsBranchName: $vcsBranch, "vcs-root-instance": { "vcs-root-id": $root } } ] },
               properties: { property: [ { name: "expected.sha", value: $sha } ] } }')
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$BASE/app/rest/buildQueue" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            -H "Authorization: Bearer $TEAMCITY_TOKEN" -d "$BODY")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY_JSON=$(echo "$RESPONSE" | sed '$d')

          [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] || {
            echo "::error::TeamCity trigger failed (HTTP $HTTP_CODE)"
            echo "$BODY_JSON"
            exit 1
          }
          BUILD_ID=$(echo "$BODY_JSON" | jq -r '.id // empty')
          [ -n "$BUILD_ID" ] || { echo "::error::Could not parse build id"; echo "$BODY_JSON"; exit 1; }

          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "build_url=$BASE/viewLog.html?buildId=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Comment build link
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_URL: ${{ steps.trigger.outputs.build_url }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          SHA: ${{ steps.pr.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$ISSUE_NUM/comments" \
            -d "$(jq -n --arg body "TeamCity build queued for \`$SHA\`: $BUILD_URL" '{ body: $body }')"
