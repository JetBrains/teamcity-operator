# Multi-node TeamCity with per-node data directory (TCC-727).
#
# Each node sets its own nodeDataDirVolumeClaim.name (exact PVC name).
# The operator creates/manages that claim, mounts it, and sets
# -Dteamcity.node.data.path. Mount name/path must match across nodes.
#
# Apply:
#   kubectl apply -f config/samples/v1beta1/_v1beta1_teamcity_with_node_data_dir.yaml
apiVersion: jetbrains.com/v1beta1
kind: TeamCity
metadata:
  name: teamcity-sample-with-node-data-dir
  namespace: default
  finalizers:
    - "teamcity.jetbrains.com/finalizer"
spec:
  image: jetbrains/teamcity-server
  startupPropertiesConfig:
    teamcity.startup.maintenance: "false"
    teamcity.firstStart.setupAdmin.enabled: "false"
  dataDirVolumeClaim:
    name: teamcity-data-dir
    volumeMount:
      name: teamcity-data-dir
      mountPath: /data/teamcity_server
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  mainNode:
    name: main-node
    spec:
      requests:
        cpu: "1000m"
        memory: "2500Mi"
      responsibilities: ["MAIN_NODE", "CAN_PROCESS_USER_DATA_MODIFICATION_REQUESTS"]
      nodeDataDirVolumeClaim:
        name: node-data-dir-main-node
        volumeMount:
          name: node-data-dir
          mountPath: /mnt/node-data-dir
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
  secondaryNodes:
    - name: secondary-node
      spec:
        requests:
          cpu: "1000m"
          memory: "2500Mi"
        responsibilities: ["CAN_PROCESS_BUILD_MESSAGES", "CAN_CHECK_FOR_CHANGES", "CAN_PROCESS_BUILD_TRIGGERS"]
        nodeDataDirVolumeClaim:
          name: node-data-dir-secondary-node
          volumeMount:
            name: node-data-dir
            mountPath: /mnt/node-data-dir
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
