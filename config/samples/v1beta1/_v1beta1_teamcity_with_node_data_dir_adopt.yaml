# Adopt existing Nightly/Helm per-node data directory PVCs (TCC-727).
#
# Nightly (release tc-project) example names:
#   main:      tc-project-teamcity-main-node-data-dir
#   secondary: node-data-dir-tc-project-teamcity-secondary-0
#
# existingClaim: true mounts the named PVC without creating or owning it.
# Spec is optional in this mode. JVM -Dteamcity.node.data.path is still set.
#
# Apply:
#   kubectl apply -f config/samples/v1beta1/_v1beta1_teamcity_with_node_data_dir_adopt.yaml
apiVersion: jetbrains.com/v1beta1
kind: TeamCity
metadata:
  name: teamcity-sample-with-node-data-dir-adopt
  namespace: default
  finalizers:
    - "teamcity.jetbrains.com/finalizer"
spec:
  image: jetbrains/teamcity-server
  startupPropertiesConfig:
    teamcity.startup.maintenance: "false"
    teamcity.firstStart.setupAdmin.enabled: "false"
  dataDirVolumeClaim:
    name: teamcity-data-dir
    volumeMount:
      name: teamcity-data-dir
      mountPath: /data/teamcity_server
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  mainNode:
    name: main-node
    spec:
      requests:
        cpu: "1000m"
        memory: "2500Mi"
      nodeDataDirVolumeClaim:
        name: existing-node-data-dir
        existingClaim: true
        volumeMount:
          name: node-data-dir
          mountPath: /mnt/node-data-dir
